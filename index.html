<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>High Value Connection</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0a0a0a;
    color: #f5f5f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .landing {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 40px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .portrait-link {
    display: block;
    width: 100%;
    max-width: 380px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    text-decoration: none;
    position: relative;
  }
  .portrait-link:hover {
    transform: scale(1.04) translateY(-4px);
  }
  .portrait-link img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: cover;
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 3.4rem);
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.05;
    background: linear-gradient(180deg, #fff 0%, #ccc 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  p {
    font-size: clamp(1.1rem, 3vw, 1.3rem);
    color: #aaa;
    max-width: 420px;
    line-height: 1.4;
  }
  .cta {
    display: inline-block;
    background: #fff;
    color: #0a0a0a;
    padding: 16px 40px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.3px;
    transition: all 0.2s ease;
    box-shadow: 0 8px 24px rgba(255,255,255,0.15);
  }
  .cta:hover {
    background: #f0f0f0;
    transform: translateY(-2px);
  }
  .phone-hint {
    font-size: 0.9rem;
    color: #666;
    margin-top: -8px;
  }
</style>
</head>
<body>
  <div class="landing">
    <a href="tel:4172990175" class="portrait-link" aria-label="Call me">
      <img src="portrait.jpg" alt="High-value contact – tap to call">
    </a>
    <h1>Can't Look Away</h1>
    <p>High-value connection. One tap. Real conversation.</p>
    <a href="tel:4172990175" class="cta">Call Now</a>
    <div class="phone-hint">417-299-0175</div>
  </div>
</body>
</html>
